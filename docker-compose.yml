services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: angel_ai_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"

  worker:
    build: ./apps/worker
    env_file: .env
    depends_on:
      - redis
      - postgres

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"

  audio-service:
    build: ./audio-service
    ports:
      - "8100:8100"

  web:
    build: ./apps/web
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"

volumes:
  postgres-data:
